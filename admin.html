<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>접수 내역 관리 · 멘토아카데미평생교육원</title>
<style>
  :root{
    --ink:#1b2333; --muted:#5a6377; --line:#e1e5f0; --ground:#f6f7fb; --surface:#fff;
    --accent:#1e4fa3; --accent-soft:#e7eefc; --ok:#0f7a51; --ok-soft:#e5f4ec;
    --warn:#a65a12; --warn-soft:#fbf0e2; --danger:#b91c1c; --danger-soft:#fde8e8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:15px;line-height:1.6;}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 18px 80px;}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 20px;}
  .notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:12px 16px;font-size:13.5px;margin-bottom:20px;line-height:1.7;}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;}
  select, button, input[type=text]{
    font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface);color:var(--ink);
  }
  button{cursor:pointer;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  button.ghost{background:transparent;}
  button.danger{color:var(--danger);border-color:var(--danger);}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:13.5px;color:var(--muted);}
  .stat b{display:block;font-size:20px;color:var(--ink);}
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  thead th{text-align:left;font-size:12.5px;color:var(--muted);background:var(--accent-soft);padding:10px 12px;font-weight:700;}
  tbody td{padding:10px 12px;border-top:1px solid var(--line);font-size:13.5px;vertical-align:top;}
  tbody tr:hover{background:#fafbff;}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;}
  .b-apply{background:var(--accent-soft);color:var(--accent);}
  .b-consult{background:#eef7ea;color:#2e7d32;}
  .b-question{background:#f3ecfb;color:#6b21a8;}
  .b-cert{background:#fdf2e0;color:#9a5b00;}
  .b-invoice{background:#e7f6f7;color:#0f766e;}
  .b-etc{background:#f1f1f1;color:#555;}
  .status-select{font-size:12.5px;padding:4px 8px;}
  .st-접수{color:var(--warn);} .st-처리중{color:var(--accent);} .st-완료{color:var(--ok);}
  .detail{white-space:pre-wrap;color:var(--muted);font-size:12.5px;max-width:320px;}
  .memo{width:150px;font-size:12.5px;}
  .empty{padding:60px 20px;text-align:center;color:var(--muted);}
  .row-actions{display:flex;gap:6px;}
  .row-actions button{padding:5px 9px;font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📋 신청 · 문의 · 예약 접수 내역</h1>
  <p class="sub">이 화면은 <b>지금 이 브라우저</b>에 저장된 접수 내역만 보여줍니다.</p>

  <div class="notice">
    ⚠️ 방문자가 홈페이지에서 신청·문의·예약을 남기면, 그 기록은 <b>방문자 각자의 브라우저</b>에만 저장됩니다(이 기기로 전송되지 않습니다).
    이 화면은 <b>같은 기기·같은 브라우저</b>에서 직접 테스트하거나, 방문자가 이 기기로 신청서를 작성했을 때만 내용이 보입니다.
    모든 신청을 실시간으로 한곳에 모으려면 별도의 폼 연동(예: Netlify Forms, 구글 폼 등)이 필요합니다.
  </div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <select id="fType">
      <option value="">전체 유형</option>
      <option value="apply">교육 신청</option>
      <option value="consult">현장컨설팅 예약</option>
      <option value="question">교육 문의</option>
      <option value="cert">수료증 발급</option>
      <option value="invoice">거래명세서</option>
    </select>
    <select id="fStatus">
      <option value="">전체 상태</option>
      <option value="접수">접수</option>
      <option value="처리중">처리중</option>
      <option value="완료">완료</option>
    </select>
    <input type="text" id="fSearch" placeholder="검색 (이름·연락처·내용)" style="min-width:200px;">
    <span style="flex:1"></span>
    <button class="ghost" id="btnExport">CSV로 내보내기</button>
    <button class="ghost" id="btnRefresh">새로고침</button>
    <button class="danger" id="btnClearAll">전체 삭제</button>
  </div>

  <div id="tableHolder"></div>
</div>

<script>
const KEY = "ma_submissions";
const TYPE_LABEL = { apply:"교육 신청", consult:"현장컨설팅 예약", question:"교육 문의", cert:"수료증 발급", invoice:"거래명세서" };
const TYPE_CLASS = { apply:"b-apply", consult:"b-consult", question:"b-question", cert:"b-cert", invoice:"b-invoice" };

function load(){
  try{ return JSON.parse(localStorage.getItem(KEY) || "[]"); }catch(_){ return []; }
}
function save(list){
  try{ localStorage.setItem(KEY, JSON.stringify(list)); }catch(_){}
}
function fmtDate(ts){
  const d = new Date(ts);
  const p = n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function detailText(data){
  if(!data || typeof data !== "object") return "";
  return Object.keys(data).map(k=> `${k}: ${data[k]}`).join("\n");
}

function render(){
  const all = load();
  const ft = document.getElementById("fType").value;
  const fs = document.getElementById("fStatus").value;
  const q = document.getElementById("fSearch").value.trim().toLowerCase();

  let list = all.slice().sort((a,b)=> b.ts - a.ts);
  if(ft) list = list.filter(x=> x.type === ft);
  if(fs) list = list.filter(x=> (x.status||"접수") === fs);
  if(q) list = list.filter(x=> JSON.stringify(x.data||{}).toLowerCase().indexOf(q) > -1 || (x.typeLabel||"").toLowerCase().indexOf(q) > -1);

  // stats (전체 기준, 필터 무관)
  const statsEl = document.getElementById("stats");
  const byStatus = { "접수":0, "처리중":0, "완료":0 };
  all.forEach(x=> { byStatus[x.status||"접수"] = (byStatus[x.status||"접수"]||0) + 1; });
  statsEl.innerHTML = `
    <div class="stat"><b>${all.length}</b>전체 접수</div>
    <div class="stat"><b>${byStatus["접수"]||0}</b>접수 대기</div>
    <div class="stat"><b>${byStatus["처리중"]||0}</b>처리중</div>
    <div class="stat"><b>${byStatus["완료"]||0}</b>완료</div>
  `;

  const holder = document.getElementById("tableHolder");
  if(!list.length){
    holder.innerHTML = `<div class="empty">해당하는 접수 내역이 없습니다.</div>`;
    return;
  }

  holder.innerHTML = `
    <table>
      <thead><tr>
        <th style="width:120px;">접수일시</th>
        <th style="width:100px;">유형</th>
        <th>내용</th>
        <th style="width:150px;">메모</th>
        <th style="width:90px;">상태</th>
        <th style="width:80px;">삭제</th>
      </tr></thead>
      <tbody>
        ${list.map(item=>{
          const cls = TYPE_CLASS[item.type] || "b-etc";
          const label = item.typeLabel || TYPE_LABEL[item.type] || item.type || "-";
          return `<tr data-id="${item.id}">
            <td>${fmtDate(item.ts)}</td>
            <td><span class="badge ${cls}">${label}</span></td>
            <td class="detail">${(detailText(item.data)||"").replace(/</g,"&lt;")}</td>
            <td><input type="text" class="memo" data-act="memo" value="${(item.memo||"").replace(/"/g,"&quot;")}" placeholder="메모"></td>
            <td>
              <select class="status-select st-${item.status||"접수"}" data-act="status">
                <option value="접수" ${item.status==="접수"||!item.status?"selected":""}>접수</option>
                <option value="처리중" ${item.status==="처리중"?"selected":""}>처리중</option>
                <option value="완료" ${item.status==="완료"?"selected":""}>완료</option>
              </select>
            </td>
            <td><div class="row-actions"><button class="danger" data-act="del">삭제</button></div></td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
  `;

  holder.querySelectorAll("[data-act='status']").forEach(el=>{
    el.addEventListener("change", ()=>{
      const id = el.closest("tr").getAttribute("data-id");
      const list2 = load();
      const it = list2.find(x=> x.id===id);
      if(it){ it.status = el.value; save(list2); render(); }
    });
  });
  holder.querySelectorAll("[data-act='memo']").forEach(el=>{
    el.addEventListener("change", ()=>{
      const id = el.closest("tr").getAttribute("data-id");
      const list2 = load();
      const it = list2.find(x=> x.id===id);
      if(it){ it.memo = el.value; save(list2); }
    });
  });
  holder.querySelectorAll("[data-act='del']").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = el.closest("tr").getAttribute("data-id");
      if(!confirm("이 접수 내역을 삭제할까요?")) return;
      const list2 = load().filter(x=> x.id!==id);
      save(list2); render();
    });
  });
}

document.getElementById("fType").addEventListener("change", render);
document.getElementById("fStatus").addEventListener("change", render);
document.getElementById("fSearch").addEventListener("input", render);
document.getElementById("btnRefresh").addEventListener("click", render);
document.getElementById("btnClearAll").addEventListener("click", ()=>{
  if(!confirm("정말 모든 접수 내역을 삭제할까요? 되돌릴 수 없습니다.")) return;
  save([]); render();
});
document.getElementById("btnExport").addEventListener("click", ()=>{
  const all = load();
  if(!all.length){ alert("내보낼 내역이 없습니다."); return; }
  const rows = [["접수일시","유형","상태","메모","상세내용"]];
  all.slice().sort((a,b)=>b.ts-a.ts).forEach(it=>{
    rows.push([
      fmtDate(it.ts),
      it.typeLabel || TYPE_LABEL[it.type] || it.type || "",
      it.status || "접수",
      it.memo || "",
      detailText(it.data).replace(/\n/g,"; ")
    ]);
  });
  const csv = "﻿" + rows.map(r=> r.map(c=> `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "접수내역_" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});

render();
</script>
</body>
</html>
